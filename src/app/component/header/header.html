<div class="header" style="display: flex;">
    <p class="profile-button" style="display: flex; align-items: center; gap: 10px;">
         <span style="font-size: 1.2rem; font-weight: 500;">{{userName().split('_')[1]}}</span>
        <img [src]="'http://localhost:8080/uploads/'+userName()+'.jpg'" style="width: 80px; height: 80px;object-fit:contain;border-radius: 50%;"/>
    </p>
    <div style="width: 95%;">
        <h1>Todo List </h1>
        <p>Welcome to your todo list!</p>
    </div>
    <button class="logout-button" type="button" (click)="logout()">Logout</button>
</div>
