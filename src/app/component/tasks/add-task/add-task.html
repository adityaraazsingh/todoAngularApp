<dialog class="add-task-dialog" open>
  <div class="dialog-card">
    <div class="dialog-header">
      <h3>
        <span class="material-icons-round">add_task</span>
        New Task
      </h3>
      <button class="close-dialog-btn" type="button" (click)="onClose()">
        <span class="material-icons-round">close</span>
      </button>
    </div>

    <form (ngSubmit)="onSubmit()" [formGroup]="form" class="add-task-form">
      <div class="form-group">
        <label for="title">Title</label>
        <input id="title" name="title" type="text" formControlName="title" placeholder="What needs to be done?" required />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <input id="description" name="description" type="text" formControlName="description" placeholder="Add some details..." required />
      </div>

      <div class="form-group">
        <label for="date">Due Date</label>
        <input id="date" name="date" type="date" formControlName="date" required />
      </div>

      @if (form.invalid && form.touched) {
        <p class="validation-error">
          <span class="material-icons-round">error_outline</span>
          Please fill in all required fields.
        </p>
      }

      <div class="dialog-actions">
        <button class="btn-secondary" type="button" (click)="onClose()">Cancel</button>
        <button class="btn-primary" [disabled]="form.invalid" type="submit">
          <span class="material-icons-round">add</span>
          Add Task
        </button>
      </div>
    </form>
  </div>
</dialog>
