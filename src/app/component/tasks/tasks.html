@if(closeDialog == false) {
  <app-add-task 
    [id]="this.tobeEditedTask().id"
    [title]="this.tobeEditedTask().title" 
    [description]="this.tobeEditedTask().description"
    [date]="this.tobeEditedTask().date"
    [userId]="this.userId()" 
    (closeDialog)="onCloseDialog()"
    >
    </app-add-task>
}
<section class="tasks-panel">
  <div class="tasks-header">
    <div>
      <h2>Task Board</h2>
      <p>Stay focused with a crisp task list and a clean workspace.</p>
    </div>
    <mat-icon class="sort-icon" (click)="changeSort()">sort</mat-icon>
    <button class="add-task-button" type="button" (click)="toggleDialog()">Add Task</button>
  </div>

  <div class="tasks-list">
    @if (mockTasks().length > 0) {
      @for(task of mockTasks(); track task.id)
      {
        <app-task [task]="task" (onEditClickTask)="onEditTask($event)" ></app-task>
      }
    }@else {
      <p class="empty-label">Select a person to see their tasks {{this.role}}</p>
    }
  </div>
</section>
