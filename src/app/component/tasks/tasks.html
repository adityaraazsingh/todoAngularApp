@if(closeDialog == false) {
  <app-add-task (closeDialog)="onCloseDialog()" (newTask)="addNewTask($event)"></app-add-task>
}
<section class="tasks-panel">
  <div class="tasks-header">
    <div>
      <h2>Task Board</h2>
      <p>Stay focused with a crisp task list and a clean workspace.</p>
    </div>
    <button class="add-task-button" type="button" (click)="toggleDialog()">Add Task</button>
  </div>

  <div class="tasks-list">
    @if (mockTasks.length > 0) {
      @for(task of mockTasks; track task.id)
      {
        <app-task [task]="task"></app-task>
      }
    }@else {
      <p class="empty-label">Select a person to see their tasks</p>
    }
  </div>
</section>
