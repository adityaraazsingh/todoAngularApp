<app-cards>
  <div class="user-row">
    <div class="avatar-wrapper">
      <img [src]="'http://localhost:8080/uploads/' + user().userName +'.jpg'" alt="{{user().userName}}'s avatar" class="avatar" />
    </div>
    <div class="user-info">
      <p class="user-name">{{ user().userName.split('_')[1] }}</p>
      <span class="user-role">{{ user().role }}</span>
    </div>
  </div>
</app-cards>
