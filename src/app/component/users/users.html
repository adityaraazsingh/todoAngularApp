<section class="users-panel">
  <div class="users-header">
    <div>
      <h2>Team Members</h2>
      <p>Quick access to the active team with clean profile previews.</p>
    </div>
  </div>
  <div class="users-list">
  @for(user of users ; track user.userId){
      <app-user [user]=user (click)="onUserIdClick(user.userId)"></app-user>
  }
  </div>
</section>
